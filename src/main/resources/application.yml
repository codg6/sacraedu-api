# Configuração comum. O perfil local é padrão; Neon exige ativação explícita.
# Hibernate só valida; Flyway é o único responsável por migrations.
spring:
  application:
    name: sacraedu-api
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SacraEduPool
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 2000
      idle-timeout: 60000
      max-lifetime: 600000
      keepalive-time: 0
      data-source-properties:
        connectTimeout: 10
        socketTimeout: 30
        tcpKeepAlive: true
        ApplicationName: sacra-edu
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  profiles:
    default: local
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
